<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreta de Detective</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap">
<style>
<style>
/* Layout: hoja impresa de "Notas del Detective" del Clue clásico; una columna, marco de doble línea, cuadrícula negra sobre papel crema */
/* Diseño de un solo tema a propósito: papel impreso, se ve igual en modo claro y oscuro */
:root{
  --table:#5b1a1f; --paper:#f6f0dc; --ink:#1c1712; --muted:#6b5f4c; --rule:#1c1712; --hair:#b9ab8c;
  --red:#a3161f; --green:#1f5a2e; --gold:#9a6b00; --hl:#ecd98f;
  --display:"Playfair Display",Georgia,"Times New Roman",serif;
  --body:"Libre Baskerville",Georgia,"Times New Roman",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--table)}
body{margin:0;background:var(--table);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-block:16px 40px;
  -webkit-tap-highlight-color:transparent}
.pad{max-width:600px;margin:0 auto;background:var(--paper);padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.frame{border:3px double var(--rule);padding:18px 14px 20px;display:flex;flex-direction:column;gap:18px}
header{text-align:center;border-bottom:2px solid var(--rule);padding-bottom:12px}
header .logo{font-family:var(--display);font-weight:900;font-size:3.4rem;line-height:1;color:var(--red);letter-spacing:.12em;margin:0;
  text-shadow:2px 2px 0 var(--ink)}
header .sub{font-family:var(--display);font-weight:700;font-size:1.05rem;letter-spacing:.32em;text-transform:uppercase;margin:8px 0 2px}
header p{margin:6px 0 0;color:var(--muted);font-style:italic;font-size:.88rem}
.label{font-family:var(--display);font-size:.72rem;text-transform:uppercase;letter-spacing:.18em;font-weight:700}

.case{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1.5px solid var(--rule)}
.case div{display:flex;flex-direction:column;gap:3px;min-width:0;padding:10px 8px;text-align:center}
.case div+div{border-left:1.5px solid var(--rule)}
.case strong{font-weight:700;font-size:.92rem;overflow-wrap:anywhere;min-height:1.3em}
.case strong.found{color:var(--red)}
.case small{color:var(--muted);font-size:.72rem;font-style:italic}

.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.82rem;color:var(--muted);justify-content:center;align-items:center}
.legend span{display:inline-flex;gap:6px;align-items:center}
.chip{display:inline-grid;place-items:center;width:22px;height:22px;border:1px solid var(--rule);font-style:normal;font-weight:700;font-size:.9rem}

.players{display:flex;flex-direction:column;gap:8px}
.plist{display:flex;flex-wrap:wrap;gap:8px}
.plist input{width:100px;padding:7px 4px;border:0;border-bottom:1.5px solid var(--rule);background:transparent;color:var(--ink);font:400 .9rem var(--body);border-radius:0}
.plist input:focus-visible,button:focus-visible,textarea:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn{border:1.5px solid var(--rule);background:transparent;color:var(--ink);padding:8px 14px;font:700 .72rem var(--display);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;min-height:40px;border-radius:0}
.btn:disabled{opacity:.35;cursor:default}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--paper)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.sheet{border:2px solid var(--rule);overflow-x:auto;background:var(--paper)}
table{border-collapse:collapse;width:100%}
th,td{padding:0;text-align:center}
thead th{font-family:var(--display);font-size:.68rem;font-weight:700;letter-spacing:.04em;padding:8px 2px;max-width:56px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;border-bottom:2px solid var(--rule);border-left:1px solid var(--rule);vertical-align:bottom}
th.name,td.name{text-align:left;position:sticky;left:0;background:var(--paper);z-index:1;padding:0 8px 0 10px;min-width:138px;max-width:170px;border-left:0}
tr.cat th{font-family:var(--display);font-weight:900;font-size:.85rem;letter-spacing:.3em;text-transform:uppercase;text-align:center;padding:7px 10px;background:var(--ink);color:var(--paper)}
tr.cat th span{position:sticky;left:10px}
td{border-bottom:1px solid var(--hair)}
td.name{font-size:.88rem}
tr.out td.name{text-decoration:line-through;text-decoration-thickness:1.5px;text-decoration-color:var(--red);color:var(--muted)}
tr.solved td{background:var(--hl)}
tr.solved td.name{font-weight:700}
tr.solved td.name::after{content:" ✦";color:var(--red)}
td.cell{width:48px}
td button{width:100%;min-width:44px;height:42px;border:0;border-left:1px solid var(--rule);background:transparent;color:var(--ink);font:700 1.2rem var(--body);cursor:pointer;border-radius:0}
td button[data-v="x"]{color:var(--red)}
td button[data-v="y"]{color:var(--green)}
td button[data-v="q"]{color:var(--gold)}
td button:active{background:var(--hl)}
tbody tr:last-child td{border-bottom:0}

textarea{width:100%;min-height:110px;padding:6px 4px;border:0;border-radius:0;color:var(--ink);font:400 .92rem/28px var(--body);resize:vertical;
  background:repeating-linear-gradient(transparent 0 27px,var(--hair) 27px 28px);background-color:transparent}
.confirm{font-size:.85rem;font-style:italic}
footer{text-align:center;font-size:.72rem;color:var(--muted);font-style:italic;border-top:1px solid var(--rule);padding-top:10px}
@media (max-width:400px){header .logo{font-size:2.8rem}}
</style>
</head>
<body>

<div class="pad"><div class="frame">
  <header>
    <h1 class="logo">CLUE</h1>
    <div class="sub">Notas del Detective</div>
    <p>Toca una casilla para anotar lo que sabes de cada jugador.</p>
  </header>

  <section class="case" aria-label="Caso">
    <div><span class="label">¿Quién?</span><strong id="c-0">—</strong><small id="n-0"></small></div>
    <div><span class="label">¿Con qué?</span><strong id="c-1">—</strong><small id="n-1"></small></div>
    <div><span class="label">¿Dónde?</span><strong id="c-2">—</strong><small id="n-2"></small></div>
  </section>

  <div class="legend" aria-label="Leyenda">
    <span><i class="chip" style="color:var(--green)">✓</i>La tiene</span>
    <span><i class="chip" style="color:var(--red)">✗</i>No la tiene</span>
    <span><i class="chip" style="color:var(--gold)">?</i>Sospecha</span>
  </div>

  <section class="players">
    <span class="label">Jugadores</span>
    <div class="plist" id="plist"></div>
    <div class="row">
      <button class="btn" id="add">+ Jugador</button>
      <button class="btn" id="del">− Jugador</button>
    </div>
  </section>

  <div class="sheet"><table id="tbl"></table></div>

  <section class="players">
    <label class="label" for="notes">Notas</label>
    <textarea id="notes" placeholder="Ana le mostró una carta a Luis (Mostaza, Cuerda, Cocina)"></textarea>
  </section>

  <div class="row" id="resetRow"></div>

  <footer>Las marcas se guardan en este dispositivo.</footer>
</div></div>

<script>
const CATS=[
  {t:"Sospechosos",items:["Señorita Escarlata","Coronel Mostaza","Señora Blanco","Señor Verde","Señora Celeste","Profesor Ciruela"]},
  {t:"Armas",items:["Candelabro","Cuchillo","Tubería","Revólver","Cuerda","Llave inglesa"]},
  {t:"Habitaciones",items:["Cocina","Salón de baile","Invernadero","Comedor","Sala de billar","Biblioteca","Sala de estar","Vestíbulo","Estudio"]}
];
const CYCLE={"":"x","x":"y","y":"q","q":""};
const SYM={"":"","x":"✗","y":"✓","q":"?"};
const KEY="clue-libreta-v1";
let S;
function fresh(){return{players:["Yo","Jugador 2","Jugador 3","Jugador 4"],marks:{},notes:""}}
function load(){try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!S||!Array.isArray(S.players))S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const k=(c,i,p)=>c+"-"+i+"-"+p;
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}

function renderPlayers(){
  const el=document.getElementById("plist");el.innerHTML="";
  S.players.forEach((n,p)=>{
    const inp=document.createElement("input");inp.id="p"+p;inp.value=n;inp.maxLength=12;inp.setAttribute("aria-label","Nombre del jugador "+(p+1));
    inp.addEventListener("input",()=>{S.players[p]=inp.value;save();const th=document.getElementById("h"+p);if(th)th.textContent=inp.value||"J"+(p+1)});
    el.appendChild(inp);
  });
  document.getElementById("add").disabled=S.players.length>=6;
  document.getElementById("del").disabled=S.players.length<=2;
}

function renderTable(){
  let h='<thead><tr><th class="name"></th>'+S.players.map((n,p)=>`<th id="h${p}" title="${esc(n)}">${esc(n)||"J"+(p+1)}</th>`).join("")+"</tr></thead><tbody>";
  CATS.forEach((cat,c)=>{
    h+=`<tr class="cat"><th colspan="${S.players.length+1}"><span>${cat.t}</span></th></tr>`;
    cat.items.forEach((it,i)=>{
      h+=`<tr id="r-${c}-${i}"><td class="name">${it}</td>`+S.players.map((_,p)=>{
        const v=S.marks[k(c,i,p)]||"";
        return `<td class="cell"><button data-k="${k(c,i,p)}" data-v="${v}" aria-label="${it}, ${esc(S.players[p])}">${SYM[v]}</button></td>`}).join("")+"</tr>";
    });
  });
  document.getElementById("tbl").innerHTML=h+"</tbody>";
  update();
}

function update(){
  CATS.forEach((cat,c)=>{
    const open=[],solved=[];
    cat.items.forEach((it,i)=>{
      const vs=S.players.map((_,p)=>S.marks[k(c,i,p)]||"");
      const out=vs.includes("y"), all=vs.every(v=>v==="x");
      const r=document.getElementById(`r-${c}-${i}`);
      r.classList.toggle("out",out);r.classList.toggle("solved",all);
      if(all)solved.push(it);if(!out)open.push(it);
    });
    const ce=document.getElementById("c-"+c),ne=document.getElementById("n-"+c);
    const ans=solved[0]||(open.length===1?open[0]:null);
    ce.textContent=ans||"—";ce.classList.toggle("found",!!ans);
    ne.textContent=ans?"¡Resuelto!":open.length+" de "+cat.items.length+" posibles";
  });
}

document.getElementById("tbl").addEventListener("click",e=>{
  const b=e.target.closest("button[data-k]");if(!b)return;
  const v=CYCLE[b.dataset.v||""];b.dataset.v=v;b.textContent=SYM[v];
  if(v)S.marks[b.dataset.k]=v;else delete S.marks[b.dataset.k];
  save();update();
});
document.getElementById("add").onclick=()=>{if(S.players.length<6){S.players.push("Jugador "+(S.players.length+1));save();renderPlayers();renderTable()}};
document.getElementById("del").onclick=()=>{if(S.players.length>2){const p=S.players.length-1;S.players.pop();
  Object.keys(S.marks).forEach(m=>{if(m.endsWith("-"+p))delete S.marks[m]});save();renderPlayers();renderTable()}};
const notes=document.getElementById("notes");
notes.addEventListener("input",()=>{S.notes=notes.value;save()});

const row=document.getElementById("resetRow");
function resetIdle(){row.innerHTML='<button class="btn" id="reset">Nueva partida</button>';document.getElementById("reset").onclick=resetAsk}
function resetAsk(){row.innerHTML='<span class="confirm">¿Borrar todas las marcas y notas?</span><button class="btn primary" id="yes">Sí, borrar</button><button class="btn" id="no">Cancelar</button>';
  document.getElementById("yes").onclick=()=>{S.marks={};S.notes="";notes.value="";save();renderTable();resetIdle()};
  document.getElementById("no").onclick=resetIdle}

load();notes.value=S.notes||"";renderPlayers();renderTable();resetIdle();
</script>
</body>
</html>
